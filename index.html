<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>С днём рождения, братик! ❤️</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #fff0e9;
      font-family: Arial, sans-serif;
    }

    .card {
      position: relative;
      width: min(100%, 850px);
      min-height: 740px;
      overflow: hidden;
      text-align: center;
      background: linear-gradient(
        to bottom,
        #ffdea0,
        #ff85a5
      );
      padding: 30px 15px 45px;
    }

    h1 {
      position: relative;
      z-index: 2;
      color: white;
      font-size: clamp(28px, 6vw, 43px);
      text-shadow: 2px 3px #b96c88;
      margin: 25px 0;
    }

    .poem {
      position: relative;
      z-index: 2;
      color: #5c2a45;
      font-size: clamp(17px, 4vw, 23px);
      font-weight: bold;
      line-height: 1.55;
    }

    .brother {
      position: relative;
      z-index: 2;
      color: #a02355;
      font-size: clamp(20px, 4.5vw, 27px);
      font-weight: bold;
      margin-top: 20px;
    }

    .cake-area {
      position: relative;
      width: 340px;
      max-width: 100%;
      height: 300px;
      margin: 12px auto 0;
    }

    .plate {
      position: absolute;
      bottom: 8px;
      left: 0;
      width: 100%;
      height: 28px;
      background: #fff9fc;
      border: 2px solid #b77491;
      border-radius: 50%;
    }

    .bottom-tier {
      position: absolute;
      bottom: 25px;
      left: 5%;
      width: 90%;
      height: 115px;
      background: #73433d;
      border-radius: 25px;
    }

    .bottom-icing {
      position: absolute;
      top: 0;
      width: 100%;
      height: 38px;
      background: #fab1cd;
      border-radius: 24px;
    }

    .top-tier {
      position: absolute;
      bottom: 132px;
      left: 18%;
      width: 64%;
      height: 95px;
      background: #f5e1cb;
      border-radius: 22px;
    }

    .top-icing {
      width: 100%;
      height: 32px;
      background: #82dad8;
      border-radius: 22px;
    }

    .candles {
      position: absolute;
      bottom: 224px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 45px;
    }

    .candle {
      position: relative;
      width: 12px;
      height: 42px;
      border-radius: 4px;
      background: repeating-linear-gradient(
        to bottom,
        white 0 10px,
        #ff7291 10px 15px
      );
    }

    .flame {
      position: absolute;
      bottom: 45px;
      left: -4px;
      width: 20px;
      height: 29px;
      background: #ff922b;
      border-radius: 60% 60% 50% 50%;
      transform-origin: bottom center;
      animation: flicker 0.35s infinite alternate;
      box-shadow: 0 0 15px #ffd166;
    }

    .flame::after {
      content: "";
      position: absolute;
      bottom: 3px;
      left: 6px;
      width: 8px;
      height: 16px;
      background: #ffe861;
      border-radius: 50%;
    }

    @keyframes flicker {
      from { transform: rotate(-8deg) scale(.95); }
      to { transform: rotate(8deg) scale(1.1); }
    }

    .decorations {
      position: absolute;
      bottom: 72px;
      left: 12%;
      width: 76%;
      display: flex;
      justify-content: space-around;
    }

    .decorations span {
      width: 10px;
      height: 10px;
      background: #ffe8f5;
      border-radius: 50%;
    }

    .signature {
      position: relative;
      z-index: 2;
      color: #912055;
      font-size: 25px;
      font-weight: bold;
      font-style: italic;
      margin: 14px 0;
    }

    .confetti {
      position: absolute;
      top: -20px;
      border-radius: 50%;
      pointer-events: none;
      animation: fall linear infinite;
    }

    @keyframes fall {
      to {
        transform: translateY(850px) rotate(720deg);
      }
    }

    .overlay {
      position: fixed;
      z-index: 100;
      inset: 0;
      background: linear-gradient(#ffdea0, #ff85a5);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 25px;
    }

    .overlay h2 {
      color: #87224c;
      font-size: 32px;
    }

    button {
      background: #d92f70;
      color: white;
      border: none;
      padding: 18px 30px;
      border-radius: 35px;
      font-size: 21px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 5px 15px #b85b83;
    }

    button:hover {
      background: #b91e5c;
    }

    .music-button {
      position: relative;
      z-index: 5;
      font-size: 15px;
      padding: 10px 20px;
      margin-top: 10px;
    }

    @media (max-width: 500px) {
      .card {
        min-height: 100vh;
      }

      .cake-area {
        transform: scale(.85);
        transform-origin: top center;
        margin-bottom: -40px;
      }
    }
  </style>
</head>

<body>

  <div class="overlay" id="overlay">
    <h2>🎁 Для моего любимого братика! ❤️</h2>
    <p>Тебя ждёт маленький сюрприз! 🎂🎶</p>
    <button onclick="openCard()">
      Открыть поздравление ❤️
    </button>
  </div>

  <main class="card" id="card">

    <h1>С ДНЁМ РОЖДЕНИЯ!</h1>

    <div class="poem">
      Пусть спина не хрустит,<br>
      колени не ноют на погоду,<br>
      а в паспорте будет написано,<br>
      что тебе всё ещё восемнадцать!
    </div>

    <div class="brother">
      С днём рождения, братик! ❤️ 😘 💕
    </div>

    <div class="cake-area">

      <div class="plate"></div>

      <div class="bottom-tier">
        <div class="bottom-icing"></div>
      </div>

      <div class="top-tier">
        <div class="top-icing"></div>
      </div>

      <div class="decorations">
        <span></span><span></span><span></span>
        <span></span><span></span><span></span>
      </div>

      <div class="candles">
        <div class="candle">
          <div class="flame"></div>
        </div>
        <div class="candle">
          <div class="flame"></div>
        </div>
        <div class="candle">
          <div class="flame"></div>
        </div>
      </div>

    </div>

    <div class="signature">
      С любовью, Илона ❤️
    </div>

    <button class="music-button" onclick="toggleMusic()">
      🎵 Включить / выключить музыку
    </button>

  </main>

  <audio id="birthdayMusic" src="song.mp3" loop></audio>

  <script>
    const card = document.getElementById("card");
    const music = document.getElementById("birthdayMusic");

    function openCard() {
      document.getElementById("overlay").style.display = "none";
      music.play().catch(error => {
        console.log("Музыку можно включить кнопкой:", error);
      });
    }

    function toggleMusic() {
      if (music.paused) {
        music.play().catch(error => {
          console.log("Не удалось запустить музыку:", error);
        });
      } else {
        music.pause();
      }
    }

    for (let i = 0; i < 100; i++) {
      const dot = document.createElement("div");
      dot.className = "confetti";

      dot.style.left = Math.random() * 100 + "%";
      dot.style.width = (4 + Math.random() * 7) + "px";
      dot.style.height = dot.style.width;

      dot.style.backgroundColor =
        `hsl(${Math.random() * 360}, 85%, 65%)`;

      dot.style.animationDuration =
        (4 + Math.random() * 6) + "s";

      dot.style.animationDelay =
        (-Math.random() * 10) + "s";

      card.appendChild(dot);
    }
  </script>
